pid /tmp/shelley-nginx/nginx.pid;
error_log /dev/stderr;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    access_log /dev/stdout;
    client_body_temp_path /tmp/shelley-nginx/client;
    proxy_temp_path /tmp/shelley-nginx/proxy;
    fastcgi_temp_path /tmp/shelley-nginx/fastcgi;
    uwsgi_temp_path /tmp/shelley-nginx/uwsgi;
    scgi_temp_path /tmp/shelley-nginx/scgi;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    server {
        listen 9000;
        server_name _;
        absolute_redirect off;
        client_max_body_size 128m;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        location = /sites { return 404; }
        location /sites/ { return 404; }
        include /home/shelley/.config/shelley/sites/*.conf;
        location / { proxy_pass http://127.0.0.1:9001; }
    }
}
